<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Umbrella-Toram Online</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/exit-confirm.css">
<link rel="stylesheet" href="css/btn-menu.css">
<link rel="stylesheet" href="css/plat-nama.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/chat-input.css">
<link rel="stylesheet" href="css/mute-notif.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/gate.css">
<link rel="stylesheet" href="css/mail.css">
<link rel="stylesheet" href="css/mail-notif.css">
<link rel="stylesheet" href="css/info.css">
<link rel="stylesheet" href="css/headline.css">
<link rel="stylesheet" href="css/brosur.css">
<link rel="stylesheet" href="css/tentang.css">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>

  <div class="rotate-wrapper">

    <div class="bg"></div>

    <!-- 🎭 NPC CONTAINER — di atas background, di bawah UI -->
    <div class="npc-container" id="npcContainer">
        <div class="npc-name-plate" onclick="openInfoModal()">
            UMBRELLA
        </div>
        <!-- Image di-load dinamis oleh stage.js -->
    </div>

    <div class="stage" id="stage">

      <!-- ============ IDENTITY GATE ============ -->
      <div id="gatekeeper" class="gatekeeper">
        <div class="gate-overlay"></div>

        <div class="gate-content">
          <p class="gate-label">Masukan Nama Anda</p>

          <div class="gate-form-wrap">
            <div class="modal-frame">
              <div class="frame-h atas">
                <div class="pojok"></div>
                <div class="garis-h"></div>
                <div class="pojok"></div>
              </div>
              <div class="frame-h bawah">
                <div class="pojok"></div>
                <div class="garis-h"></div>
                <div class="pojok"></div>
              </div>
              <div class="frame-v kiri">
                <div class="pojok"></div>
                <div class="garis-v"></div>
                <div class="pojok"></div>
              </div>
              <div class="frame-v kanan">
                <div class="pojok"></div>
                <div class="garis-v"></div>
                <div class="pojok"></div>
              </div>
            </div>

            <input type="text" id="gate-input" placeholder="Nama / IGN" maxlength="15" autocomplete="off">
          </div>

          <p class="gate-message" id="gateMessage"></p>

          <div class="btn-svg gate-btn" onclick="saveIdentity()">
            <div class="btn-ujung-kiri"></div>
            <div class="btn-tengah"><span class="btn-teks">SELESAI</span></div>
            <div class="btn-ujung-kanan"></div>
          </div>
        </div>
      </div>

      <!-- ============ TOMBOL KIRI ============ -->
      <div class="btn-wrap kiri-atas" id="btnKiri">
        <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
          <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
        </svg>
        <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
          <image href="Assets/SVG_BTN-MENU.svg" width="200" height="80"/>
        </svg>
        <div class="ikon" id="ikonKiri">
          <img src="Assets/SVG_ICON-MENU.svg" alt="">
        </div>
      
        <div class="plat-nama">
          <div class="plat-bg"></div>
          <div class="ujung-kiri"></div>
          <span class="teks-nama" id="current-ign-display">Guest</span>
          <div class="ujung-kanan"></div>
          <div class="mail-notif" id="mailNotifIcon" style="display:none;" onclick="openMailFromNotif()">📩</div>
        </div>
      </div>

      <!-- ============ TOMBOL KANAN ============ -->
      <div class="btn-wrap kanan-atas" id="btnKanan">
        <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
          <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
        </svg>
        <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
          <image href="Assets/SVG_BTN-MENU.svg" width="200" height="80"/>
        </svg>
        <div class="ikon" id="ikonKanan">
          <img src="Assets/SVG_ICON-CHAT.svg" alt="">
        </div>
      </div>

      <!-- ============ NOTIFIKASI MUTE ============ -->
      <div class="mute-notif" id="muteNotif"></div>

      <!-- ============ CHAT BOX ============ -->
      <div class="chat-box" id="chatBox">
        <div class="chat-drag" id="chatDrag"></div>
        <div class="chat-body" id="chatLogs">
          <div class="chat-line">
            <span class="chat-name">[Guild]:</span>
            <span class="chat-text">Selamat datang di guild UMBRELLA!</span>
          </div>
        </div>
      </div>

      <!-- ============ FORM TULIS CHAT ============ -->
      <div class="chat-input-overlay" id="chatInputOverlay">
        <div class="input-overlay-bg" onclick="closeChatInput()"></div>

        <div class="chat-input-wrap">
          <div class="chat-input-box"
               id="chatInputBox"
               contenteditable="true"
               data-placeholder="Ketik pesan..."></div>

          <div class="btn-svg" onclick="kirimChat()">
            <div class="btn-ujung-kiri"></div>
            <div class="btn-tengah"><span class="btn-teks">KIRIM</span></div>
            <div class="btn-ujung-kanan"></div>
          </div>
        </div>

        <p class="chat-input-message" id="chatInputMessage"></p>
      </div>

      <!-- ============ MODAL MENU ============ -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <div class="modal-content">
            <div class="btn-svg modal-list-item" onclick="menuClick('info')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Info Serikat</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
            <div class="btn-svg modal-list-item" onclick="menuClick('kotak_surat')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Kotak Surat</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
            <div class="btn-svg modal-list-item" onclick="menuClick('ganti')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Ganti Nama</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
            <div class="btn-svg modal-list-item" onclick="menuClick('tentang')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Tentang Kami</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
            <div class="btn-svg modal-list-item" onclick="menuClick('gallery')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Gallery</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ============ MAIL OVERLAY (Mail 2 Arah) ============ -->
      <div class="mail-overlay" id="mailOverlay">
        <div class="mail-modal">
          
          <!-- Bingkai -->
          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>
          
          <!-- Header -->
          <div class="mail-header">KOTAK SURAT</div>
          
          <!-- Konten Utama (di-render JS) -->
          <div id="mailContent"></div>
          
        </div>
      </div>

      <!-- ============ MODAL INFO SERIKAT ============ -->
      <div class="info-overlay" id="infoOverlay">
        <div class="info-modal">

          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <div class="info-header">UMBRELLA</div>

          <div class="info-body">
            <div class="info-logo-col">
              <img src="Assets/logo.svg" alt="Logo Umbrella">
            </div>

            <div class="info-content-col" id="infoContentCol">
              <div class="info-loading">Memuat data...</div>
            </div>
          </div>

        </div>
      </div>

      <!-- ============ HEADLINE BANNER CONTAINER ============ -->
      <div class="headline-banner-container" id="headlineBannerContainer"></div>

      <!-- ============ HEADLINE POPUP ============ -->
      <div class="headline-overlay" id="headlineOverlay">
        <div class="headline-popup">

          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <div class="headline-header" id="headlineHeader">Pengumuman</div>

          <!-- 🎯 Tombol close X DIHAPUS — sudah ada tombol BACK & HOME di menu utama -->

          <div class="headline-body" id="headlineBody"></div>

        </div>
      </div>

      <!-- ============ MODAL TENTANG KAMI ============ -->
      <div class="tentang-overlay" id="tentangOverlay">
        <div class="tentang-modal">

          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <div class="tentang-header">
            <img src="Assets/logo.svg" class="tentang-header-logo" alt="Logo">
            <h1 class="tentang-header-name">UMBRELLA</h1>
          </div>

          <div class="tentang-body" id="tentangBody"></div>

        </div>
      </div>

      <!-- ============ MODAL GALLERY ============ -->
      <div class="gallery-overlay" id="galleryOverlay">
        <div class="gallery-modal">

          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <div class="gallery-header">GALLERY</div>

          <div class="gallery-body" id="galleryBody"></div>

        </div>
      </div>

      <!-- ============ LIGHTBOX ============ -->
      <div class="gallery-lightbox" id="galleryLightbox">
        <button class="gallery-lb-close" onclick="closeLightbox()">×</button>
        <div class="gallery-lb-counter" id="galleryLbCounter">1 / 1</div>

        <img class="gallery-lb-img" id="galleryLbImg" src="" alt="">

        <div class="gallery-lb-info">
          <div class="gallery-lb-title" id="galleryLbTitle"></div>
          <div class="gallery-lb-caption" id="galleryLbCaption"></div>
        </div>

        <div class="gallery-lb-nav prev" onclick="lightboxPrev()">◀</div>
        <div class="gallery-lb-nav next" onclick="lightboxNext()">▶</div>
      </div>

      <!-- ============ POPUP KONFIRMASI KELUAR ============ -->
      <div class="exit-overlay" id="exitOverlay">
        <div class="exit-modal">

          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <div class="exit-text">Yakin ingin keluar dari halaman?</div>

          <div class="exit-actions">

            <div class="btn-svg btn-tidak" onclick="batalKeluar()">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">TIDAK</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>

            <div class="btn-svg" onclick="konfirmasiKeluar()">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">YA</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>

          </div>

        </div>
      </div>

    </div>

  </div>

  <!-- ============ SCRIPT ============ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/exit-confirm.js"></script>
  <script src="js/api.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/identity.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/chat-input.js"></script>
  <script src="js/mute-notif.js"></script>
  <script src="js/mail.js"></script>
  <script src="js/info.js"></script>
  <script src="js/headline.js"></script>
  <script src="js/brosur.js"></script>
  <script src="js/tentang.js"></script>
  <script src="js/gallery.js"></script>

</body>
</html>
