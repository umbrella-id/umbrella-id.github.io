<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guild Toram</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/btn-menu.css">
<link rel="stylesheet" href="css/plat-nama.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/chat-input.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/gate.css">
<link rel="stylesheet" href="css/mail.css">
<link rel="stylesheet" href="css/info.css">
<link rel="stylesheet" href="css/headline.css">
<link rel="stylesheet" href="css/brosur.css">
</head>
<body>

  <div class="rotate-wrapper">

    <div class="bg"></div>

    <div class="stage" id="stage">

      <!-- ============ IDENTITY GATE ============ -->
      <div id="gatekeeper" class="gatekeeper">
        <div class="gate-overlay"></div>

        <div class="gate-content">
          <p class="gate-label">Masukan Nama Anda</p>

          <div class="gate-form-wrap">
            <div class="modal-frame">
              <div class="frame-h atas">
                <div class="pojok"></div>
                <div class="garis-h"></div>
                <div class="pojok"></div>
              </div>
              <div class="frame-h bawah">
                <div class="pojok"></div>
                <div class="garis-h"></div>
                <div class="pojok"></div>
              </div>
              <div class="frame-v kiri">
                <div class="pojok"></div>
                <div class="garis-v"></div>
                <div class="pojok"></div>
              </div>
              <div class="frame-v kanan">
                <div class="pojok"></div>
                <div class="garis-v"></div>
                <div class="pojok"></div>
              </div>
            </div>

            <input type="text" id="gate-input" placeholder="Nama / IGN" maxlength="15" autocomplete="off">
          </div>

          <p class="gate-message" id="gateMessage"></p>

          <div class="btn-svg gate-btn" onclick="saveIdentity()">
            <div class="btn-ujung-kiri"></div>
            <div class="btn-tengah"><span class="btn-teks">SELESAI</span></div>
            <div class="btn-ujung-kanan"></div>
          </div>
        </div>
      </div>

      <!-- ============ TOMBOL KIRI ============ -->
      <div class="btn-wrap kiri-atas" id="btnKiri">
        <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
          <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
        </svg>
        <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
          <image href="Assets/SVG_BTN-MENU.svg" width="200" height="80"/>
        </svg>
        <div class="ikon" id="ikonKiri">
          <img src="Assets/SVG_ICON-MENU.svg" alt="">
        </div>
      
        <div class="plat-nama">
          <div class="plat-bg"></div>
          <div class="ujung-kiri"></div>
          <span class="teks-nama" id="current-ign-display">Guest</span>
          <div class="ujung-kanan"></div>
        </div>
      </div>

      <!-- ============ TOMBOL KANAN ============ -->
      <div class="btn-wrap kanan-atas" id="btnKanan">
        <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
          <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
        </svg>
        <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
          <image href="Assets/SVG_BTN-MENU.svg" width="200" height="80"/>
        </svg>
        <div class="ikon" id="ikonKanan">
          <img src="Assets/SVG_ICON-CHAT.svg" alt="">
        </div>
      </div>

      <!-- ============ CHAT BOX ============ -->
      <div class="chat-box" id="chatBox">
        <div class="chat-drag" id="chatDrag"></div>
        <div class="chat-body" id="chatLogs">
          <div class="chat-line">
            <span class="chat-name">[Guild]:</span>
            <span class="chat-text">Selamat datang di guild UMBRELLA!</span>
          </div>
        </div>
      </div>

      <!-- ============ FORM TULIS CHAT ============ -->
      <div class="chat-input-overlay" id="chatInputOverlay">
        <div class="input-overlay-bg" onclick="closeChatInput()"></div>

        <div class="chat-input-wrap">
          <div class="chat-input-box"
               id="chatInputBox"
               contenteditable="true"
               data-placeholder="Ketik pesan..."></div>

          <div class="btn-svg" onclick="kirimChat()">
            <div class="btn-ujung-kiri"></div>
            <div class="btn-tengah"><span class="btn-teks">KIRIM</span></div>
            <div class="btn-ujung-kanan"></div>
          </div>
        </div>

        <p class="chat-input-message" id="chatInputMessage"></p>
      </div>

      <!-- ============ MODAL MENU ============ -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <div class="modal-content">
            <div class="btn-svg modal-list-item" onclick="menuClick('info')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Info Serikat</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
            <div class="btn-svg modal-list-item" onclick="menuClick('kirim')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Kirim surat</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
            <div class="btn-svg modal-list-item" onclick="menuClick('ganti')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Ganti Nama</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
            <div class="btn-svg modal-list-item" onclick="menuClick('tentang')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Tentang Kami</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
            <div class="btn-svg modal-list-item" onclick="menuClick('gallery')">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">Gallery</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ============ FORM KIRIM SURAT ============ -->
      <div class="mail-overlay" id="mailOverlay">
        <div class="mail-modal">

          <!-- Bingkai -->
          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <!-- Header -->
          <div class="mail-header">KIRIM SURAT</div>

          <!-- Body -->
          <div class="mail-body">

            <!-- Kategori -->
            <div class="mail-group">
              <label class="mail-label">KATEGORI</label>
              <div class="mail-kategori-btn" onclick="toggleKategoriList()">
                <span id="mailKategoriLabel">Umum / General</span>
              </div>
              <div class="mail-kategori-list" id="mailKategoriList">
                <div class="mail-kategori-item" onclick="pilihKategori('Umum')">Umum / General</div>
                <div class="mail-kategori-item" onclick="pilihKategori('Request Join')">Request Join</div>
                <div class="mail-kategori-item" onclick="pilihKategori('Saran')">Saran / Masukan</div>
              </div>
            </div>

            <!-- WhatsApp (khusus Request Join) -->
            <div class="mail-group wa-group">
              <label class="mail-label">NOMOR WHATSAPP</label>
              <input type="tel" class="mail-input" id="mailWA" placeholder="08xxxxxxxxxx" maxlength="15">
            </div>

            <!-- Pesan -->
            <div class="mail-group" style="flex:1;">
              <label class="mail-label">PESAN</label>
              <textarea class="mail-textarea" id="mailPesan" placeholder="Tulis pesan Anda..." maxlength="1000"></textarea>
            </div>

          </div>

          <!-- Footer -->
          <div class="mail-footer">
            <div class="btn-svg" onclick="kirimMail()">
              <div class="btn-ujung-kiri"></div>
              <div class="btn-tengah"><span class="btn-teks">KIRIM</span></div>
              <div class="btn-ujung-kanan"></div>
            </div>
          </div>

          <!-- Pesan error/sukses -->
          <p class="mail-message" id="mailMessage"></p>

        </div>
      </div>

      <!-- ============ MODAL INFO SERIKAT ============ -->
      <div class="info-overlay" id="infoOverlay">
        <div class="info-modal">

          <!-- Bingkai -->
          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <!-- Header -->
          <div class="info-header">UMBRELLA</div>

          <!-- Body: 2 kolom -->
          <div class="info-body">
            <!-- Kiri: logo -->
            <div class="info-logo-col">
              <img src="Assets/logo.svg" alt="Logo Umbrella">
            </div>

            <!-- Kanan: list / isi -->
            <div class="info-content-col" id="infoContentCol">
              <div class="info-loading">Memuat data...</div>
            </div>
          </div>

        </div>
      </div>

      <!-- ============ HEADLINE BANNER CONTAINER ============ -->
      <div class="headline-banner-container" id="headlineBannerContainer"></div>

      <!-- ============ HEADLINE POPUP ============ -->
      <div class="headline-overlay" id="headlineOverlay">
        <div class="headline-popup">

          <!-- Bingkai -->
          <div class="modal-frame">
            <div class="frame-h atas">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-h bawah">
              <div class="pojok"></div>
              <div class="garis-h"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kiri">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
            <div class="frame-v kanan">
              <div class="pojok"></div>
              <div class="garis-v"></div>
              <div class="pojok"></div>
            </div>
          </div>

          <!-- Header -->
          <div class="headline-header" id="headlineHeader">Pengumuman</div>

          <!-- Tombol Close -->
          <button class="headline-close" onclick="closeHeadlinePopup()" aria-label="Tutup">×</button>

          <!-- Body -->
          <div class="headline-body" id="headlineBody"></div>

        </div>
      </div>

    </div>

  </div>

  <!-- ============ SCRIPT ============ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/identity.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/chat-input.js"></script>
  <script src="js/mail.js"></script>
  <script src="js/info.js"></script>
  <script src="js/headline.js"></script>
  <script src="js/brosur.js"></script>

</body>
</html>
