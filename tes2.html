<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guild Toram</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Optima', 'Optima LT', 'Segoe UI', Candara, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: url('Assets/Background.png') no-repeat center center;
    background-size: cover;
    z-index: 1;
  }

  .stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 300px;
    transform-origin: center center;
    z-index: 2;
  }

  /* ===== TOMBOL MENU ===== */
  .btn-wrap {
    position: absolute;
    top: 0;
    width: 180px;
    height: 72px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  .btn-wrap.kiri-atas { top: 0; left: 0; }
  .btn-wrap.kanan-atas { top: 0; right: 0; }

  .btn-wrap svg {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .btn-wrap .svg-ornamen { top: 0; left: 0; }
  .btn-wrap .svg-tombol {
    top: 50%;
    left: 50%;
    width: 70%;
    height: 70%;
    transform: translate(-50%, -50%);
    transform-origin: center;
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  .btn-wrap:hover .svg-tombol {
    filter: brightness(1.25) drop-shadow(0 0 10px rgba(107, 189, 232, 0.8));
  }
  .btn-wrap:active .svg-tombol {
    transform: translate(-50%, -50%) scale(0.9);
    filter: brightness(0.75) drop-shadow(0 0 4px rgba(107, 189, 232, 0.4));
  }
  .btn-wrap .ikon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 3;
  }

  /* ===== PLAT NAMA ===== */
  .plat-nama {
    position: absolute;
    top: 5px;
    left: 155px;
    height: 38px;
    display: flex;
    align-items: stretch;
    z-index: 3;
    pointer-events: none;
    white-space: nowrap;
  }
  .plat-nama .ujung-kiri {
    width: 28px;
    height: 100%;
    background: url('Assets/SVG_IGN-L.svg') no-repeat center center;
    background-size: 100% 100%;
    flex-shrink: 0;
  }
  .plat-nama .tengah {
    height: 100%;
    flex-grow: 1;
    min-width: 60px;
    position: relative;
    background: url('Assets/SVG_IGN-M.svg') no-repeat center center;
    background-size: 100% 100%;
  }
  .plat-nama .ujung-kanan {
    width: 38px;
    height: 100%;
    background: url('Assets/SVG_IGN-R.svg') no-repeat center center;
    background-size: 100% 100%;
    flex-shrink: 0;
  }
  .plat-nama .teks-nama {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #f5e6c8;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.5px;
    white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }

  /* ===== CHAT BOX ===== */
  .chat-box {
    position: absolute;
    bottom: 0;
    left: 25%;
    width: 50%;
    height: 25%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 100;
    display: flex;
    flex-direction: column;
    transition: height 0.25s ease-out;
  }
  .chat-box.dragging { transition: none; }

  .chat-drag {
    position: absolute;
    top: -10px;
    left: 0;
    width: 100%;
    height: 20px;
    cursor: ns-resize;
    z-index: 1;
  }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px;
    color: #e0d5b8;
    font-size: 11px;
    line-height: 1.5;
  }
  .chat-line { padding: 2px 0; }
  .chat-name { color: #f0d78c; font-weight: 600; margin-right: 6px; }
  .chat-text { color: #e0d5b8; }
  .chat-body::-webkit-scrollbar { width: 4px; }
  .chat-body::-webkit-scrollbar-thumb {
    background: rgba(201, 165, 90, 0.4);
    border-radius: 2px;
  }

  /* ============================================
     TOMBOL SVG (REUSABLE) — 3 SVG
     ============================================ */
  .btn-svg {
    display: inline-flex;
    align-items: stretch;
    height: 24px;                /* tinggi tombol */
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  .btn-svg .btn-ujung-kiri {
    width: 12px;                 /* lebar ujung kiri (rasio 15:30 → 12:24) */
    height: 100%;
    background: url('Assets/SVG_BTN-L.svg') no-repeat center center;
    background-size: 100% 100%;
    flex-shrink: 0;
  }

  .btn-svg .btn-tengah {
    height: 100%;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    background: url('Assets/SVG_BTN-M.svg') no-repeat center center;
    background-size: 100% 100%;
    position: relative;
    min-width: 40px;
  }

  .btn-svg .btn-ujung-kanan {
    width: 12px;                 /* lebar ujung kanan */
    height: 100%;
    background: url('Assets/SVG_BTN-R.svg') no-repeat center center;
    background-size: 100% 100%;
    flex-shrink: 0;
  }

  .btn-svg .btn-teks {
    color: #ffffff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    font-family: inherit;
  }

  /* Hover */
  .btn-svg:hover {
    filter: brightness(1.2) drop-shadow(0 0 6px rgba(107, 189, 232, 0.7));
  }

  /* Tekan */
  .btn-svg:active {
    transform: scale(0.95);
    filter: brightness(0.8);
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    position: relative;
    min-width: 220px;
    min-height: 120px;
    padding: 26px 44px 22px 44px;
    background: rgba(15, 10, 6, 0.92);
    color: #f5e6c8;
    overflow: visible;
    animation: modalIn 0.25s ease-out;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ===== BINGKAI ===== */
  .modal-frame {
    position: absolute;
    top: 0;
    bottom: 0;
    left: -8px;
    right: -8px;
    pointer-events: none;
    z-index: 1;
  }

  .frame-h {
    position: absolute;
    left: 0;
    right: 0;
    height: 24px;
    display: flex;
    align-items: stretch;
  }
  .frame-h.atas  { top: 0; }
  .frame-h.bawah { bottom: 0; }

  .frame-v {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .frame-v.kiri  { left: 0; }
  .frame-v.kanan { right: 0; }

  .pojok {
    width: 30px;
    height: 24px;
    flex-shrink: 0;
    background: url('Assets/MODAL-CORNER.svg') no-repeat center center;
    background-size: 100% 100%;
  }

  /* ===== FLIP POJOK ===== */
  .frame-h.atas .pojok:nth-child(3) { transform: scaleX(-1); }
  .frame-h.bawah .pojok:nth-child(1) { transform: scaleY(-1); }
  .frame-h.bawah .pojok:nth-child(3) { transform: scaleX(-1) scaleY(-1); }
  .frame-v.kiri .pojok:nth-child(3) { transform: scaleY(-1); }
  .frame-v.kanan .pojok:nth-child(1) { transform: scaleX(-1); }
  .frame-v.kanan .pojok:nth-child(3) { transform: scaleX(-1) scaleY(-1); }

  /* ===== GARIS ===== */
  .garis-h {
    flex-grow: 1;
    height: 100%;
    background: url('Assets/MODAL-H.svg') no-repeat center center;
    background-size: 100% 100%;
  }
  .frame-h.bawah .garis-h { transform: scaleY(-1); }

  .garis-v {
    flex-grow: 1;
    width: 100%;
    background: url('Assets/MODAL-V.svg') no-repeat center center;
    background-size: 100% 100%;
  }
  .frame-v.kanan .garis-v { transform: scaleX(-1); }

  /* ===== ISI MODAL ===== */
  .modal-header {
    position: relative;
    padding-bottom: 10px;
    margin-bottom: 12px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #f0d78c;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    z-index: 2;
  }
  .modal-header::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: url('Assets/MODAL-HEADER.svg') no-repeat center center;
    background-size: 100% 100%;
    opacity: 0.9;
  }

  .modal-body {
    font-size: 11px;
    line-height: 1.6;
    color: #e0d5b8;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .modal-footer {
    position: relative;
    margin-top: 14px;
    padding-top: 12px;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 2;
  }
  .modal-footer::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 3px;
    background: url('Assets/MODAL-HEADER.svg') no-repeat center center;
    background-size: 100% 100%;
    opacity: 0.9;
  }

  /* ===== RESPONSIF ===== */
  @media (max-aspect-ratio: 22/10) {
    .btn-wrap.kiri-atas { transform: translateX(-30%); }
    .btn-wrap.kanan-atas { transform: translateX(30%); }
  }

  /* ===== PORTRAIT ===== */
  .rotate-warning {
    display: none;
    position: fixed;
    inset: 0;
    background: #1a1a1a;
    color: #f0d78c;
    z-index: 99999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .rotate-warning .ikon-putar {
    font-size: 64px;
    margin-bottom: 20px;
    animation: putar 1.6s ease-in-out infinite;
  }
  .rotate-warning h2 { font-size: 20px; margin-bottom: 8px; }
  .rotate-warning p { font-size: 14px; color: #c9a55a; }
  @keyframes putar {
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(90deg); }
    100% { transform: rotate(0deg); }
  }
  @media (orientation: portrait) {
    .rotate-warning { display: flex; }
    .stage, .bg { display: none; }
  }

</style>
</head>
<body>

  <div class="bg"></div>

  <div class="stage" id="stage">

    <!-- TOMBOL KIRI + PLAT NAMA -->
    <div class="btn-wrap kiri-atas" id="btnKiri">
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>
      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BTN-MENU.svg" width="200" height="80"/>
      </svg>
      <div class="ikon"></div>
      <div class="plat-nama">
        <div class="ujung-kiri"></div>
        <div class="tengah"><span class="teks-nama">PLAYER</span></div>
        <div class="ujung-kanan"></div>
      </div>
    </div>

    <!-- TOMBOL KANAN -->
    <div class="btn-wrap kanan-atas">
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>
      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BTN-MENU.svg" width="200" height="80"/>
      </svg>
      <div class="ikon"></div>
    </div>

    <!-- CHAT BOX -->
    <div class="chat-box" id="chatBox">
      <div class="chat-drag" id="chatDrag"></div>
      <div class="chat-body">
        <div class="chat-line"><span class="chat-name">[Guild]:</span><span class="chat-text">Selamat datang di guild UMBRELLA!</span></div>
        <div class="chat-line"><span class="chat-name">Player1:</span><span class="chat-text">Halo semua</span></div>
        <div class="chat-line"><span class="chat-name">Player2:</span><span class="chat-text">Ayo raid malam ini</span></div>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">

        <div class="modal-frame">
          <div class="frame-h atas">
            <div class="pojok"></div>
            <div class="garis-h"></div>
            <div class="pojok"></div>
          </div>
          <div class="frame-h bawah">
            <div class="pojok"></div>
            <div class="garis-h"></div>
            <div class="pojok"></div>
          </div>
          <div class="frame-v kiri">
            <div class="pojok"></div>
            <div class="garis-v"></div>
            <div class="pojok"></div>
          </div>
          <div class="frame-v kanan">
            <div class="pojok"></div>
            <div class="garis-v"></div>
            <div class="pojok"></div>
          </div>
        </div>

        <div class="modal-header">INFO SERIKAT</div>
        <div class="modal-body">
          <p>Selamat datang di guild <strong>UMBRELLA</strong>!</p>
          <p style="margin-top: 6px;">Level guild: 10</p>
          <p>Member: 25 / 30</p>
        </div>
        <div class="modal-footer">

          <!-- TOMBOL SVG (pakai 3 file) -->
          <div class="btn-svg" onclick="closeModal()">
            <div class="btn-ujung-kiri"></div>
            <div class="btn-tengah"><span class="btn-teks">TUTUP</span></div>
            <div class="btn-ujung-kanan"></div>
          </div>

        </div>

      </div>
    </div>

  </div>

  <!-- PORTRAIT -->
  <div class="rotate-warning">
    <div class="ikon-putar">📱</div>
    <h2>PUTAR PERANGKAT</h2>
    <p>Halaman ini hanya bisa dibuka dalam mode landscape</p>
  </div>

  <script>
    const BASE_HEIGHT = 300;

    function resizeStage() {
      const stage = document.getElementById('stage');
      if (!stage) return;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scale = vh / BASE_HEIGHT;
      const stageWidth = vw / scale;
      stage.style.width = stageWidth + 'px';
      stage.style.height = BASE_HEIGHT + 'px';
      stage.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }
    window.addEventListener('load', resizeStage);
    window.addEventListener('resize', resizeStage);
    window.addEventListener('orientationchange', resizeStage);

    // CHAT DRAG
    const chatBox = document.getElementById('chatBox');
    const chatDrag = document.getElementById('chatDrag');
    let isDragging = false, startY = 0, startHeight = 0;
    const DEFAULT_PERCENT = 25, SNAP_THRESHOLD = 90, FULL_PERCENT = 100, MIN_PERCENT = 3;

    function getY(e) {
      return e.clientY || (e.touches && e.touches[0].clientY) || 0;
    }
    function onDown(e) {
      isDragging = true;
      startY = getY(e);
      startHeight = chatBox.getBoundingClientRect().height;
      chatBox.classList.add('dragging');
      e.preventDefault();
    }
    function onMove(e) {
      if (!isDragging) return;
      const deltaY = startY - getY(e);
      const vh = window.innerHeight;
      const percent = ((startHeight + deltaY) / vh) * 100;
      const clamped = Math.max(MIN_PERCENT, Math.min(FULL_PERCENT, percent));
      chatBox.style.height = clamped + '%';
      e.preventDefault();
    }
    function onUp() {
      if (!isDragging) return;
      isDragging = false;
      chatBox.classList.remove('dragging');
      const vh = window.innerHeight;
      const h = chatBox.getBoundingClientRect().height;
      const p = (h / vh) * 100;
      chatBox.style.height = (p > SNAP_THRESHOLD ? FULL_PERCENT : DEFAULT_PERCENT) + '%';
    }
    chatDrag.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    chatDrag.addEventListener('touchstart', onDown, { passive: false });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);

    // MODAL
    const modalOverlay = document.getElementById('modalOverlay');
    function openModal() { modalOverlay.classList.add('open'); }
    function closeModal() { modalOverlay.classList.remove('open'); }

    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
    document.getElementById('btnKiri').addEventListener('click', function(e) {
      if (e.target.closest('.plat-nama')) return;
      openModal();
    });
  </script>

</body>
</html>
