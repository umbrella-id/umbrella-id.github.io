<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild Toram</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* Background game */
  .bg {
    position: fixed;
    inset: 0;
    background: url('Assets/Background.png') no-repeat center center;
    background-size: cover;
    z-index: 1;
  }

  /* Stage */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    z-index: 2;
  }

  /* ===== WRAPPER TOMBOL ===== */
  .btn-wrap {
    position: absolute;
    width: 200px;
    height: 80px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-wrap.kiri-atas { top: 10px; left: 10px; }
  .btn-wrap.kanan-atas { top: 10px; right: 10px; }

  /* ===== ORNAMEN & TOMBOL (SVG inline) ===== */
  .btn-wrap svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: transform 0.1s ease, filter 0.15s ease;
    pointer-events: none;
  }

  /* Tombol di atas ornamen, sedikit lebih kecil */
  .btn-wrap .svg-tombol {
    inset: 15% 18%;   /* atas-bawah kiri-kanan, biar di dalam ornamen */
    width: auto;
    height: auto;
    transform-origin: center;
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  /* Hover (desktop) */
  .btn-wrap:hover .svg-tombol {
    filter: brightness(1.25) drop-shadow(0 0 10px rgba(107, 189, 232, 0.8));
  }

  /* Efek tekan — hanya SVG tombol yang berubah, bukan kotaknya */
  .btn-wrap:active .svg-tombol {
    transform: scale(0.9);
    filter: brightness(0.75) drop-shadow(0 0 4px rgba(107, 189, 232, 0.4));
  }

</style>
</head>
<body>

  <div class="bg"></div>

  <div class="stage">

    <!-- Tombol KIRI ATAS -->
    <div class="btn-wrap kiri-atas">
      <!-- Ornamen -->
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>
      <!-- Tombol -->
      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BT-MENU.svg" width="200" height="80"/>
      </svg>
    </div>

    <!-- Tombol KANAN ATAS -->
    <div class="btn-wrap kanan-atas">
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>
      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BT-MENU.svg" width="200" height="80"/>
      </svg>
    </div>

  </div>

</body>
</html>
