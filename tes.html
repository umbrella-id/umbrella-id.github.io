<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guild Toram</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== BACKGROUND GAME ===== */
  .bg {
    position: fixed;
    inset: 0;
    background: url('Assets/Background.png') no-repeat center center;
    background-size: cover;
    z-index: 1;
  }

  /* ===== STAGE ===== */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    z-index: 2;
  }

  /* ===== WRAPPER TOMBOL ===== */
  .btn-wrap {
    position: absolute;
    top: 0;
    width: 180px;
    height: 72px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-wrap.kiri-atas { top: 0; left: 0; }
  .btn-wrap.kanan-atas { top: 0; right: 0; }

  .btn-wrap svg {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .btn-wrap .svg-ornamen { top: 0; left: 0; }

  .btn-wrap .svg-tombol {
    top: 50%;
    left: 50%;
    width: 70%;
    height: 70%;
    transform: translate(-50%, -50%);
    transform-origin: center;
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  .btn-wrap:hover .svg-tombol {
    filter: brightness(1.25) drop-shadow(0 0 10px rgba(107, 189, 232, 0.8));
  }

  .btn-wrap:active .svg-tombol {
    transform: translate(-50%, -50%) scale(0.9);
    filter: brightness(0.75) drop-shadow(0 0 4px rgba(107, 189, 232, 0.4));
  }

  .btn-wrap .ikon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 3;
    transition: transform 0.1s ease;
  }

  .btn-wrap .ikon img,
  .btn-wrap .ikon svg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
  }

  /* ===== PLAT NAMA (IGN) ===== */
  /* Wrapper pakai position relative, biar ujung & tengah bisa absolute */
  .plat-nama {
    position: absolute;
    top: 18px;
    left: 170px;
    height: 38px;              /* tinggi ornamen penuh */
    display: flex;             /* untuk hitung lebar otomatis */
    align-items: stretch;
    z-index: 3;
    pointer-events: none;
  }

  /* Ujung kiri (SVG_IGN-L) — full tinggi, di ATAS */
  .plat-nama .ujung-kiri {
    width: 24px;
    height: 100%;
    background: url('Assets/SVG_IGN-L.svg') no-repeat center center;
    background-size: 100% 100%;
    flex-shrink: 0;
    position: relative;
    z-index: 3;                 /* ← paling atas */
  }

  /* Tengah — kapsul, diposisikan absolute biar bisa nongol ke kiri & kanan
     tanpa menggeser ornamen */
  .plat-nama .tengah {
    position: absolute;
    /* Posisi vertikal: 5% dari atas, 45% dari bawah */
    top: 5%;
    bottom: 45%;

    /* Melebar ke kiri & kanan, biar tepinya nyelip di bawah ornamen */
    left: -10px;               /* ← masuk ke kiri */
    right: -10px;              /* ← masuk ke kanan */

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 40px;           /* biar teks nggak nempel tepi kapsul */

    background: rgba(15, 10, 6, 0.5);   /* ← transparan 50% */
    border-top: 1px solid rgba(201, 165, 90, 0.5);
    border-bottom: 1px solid rgba(201, 165, 90, 0.5);
    border-radius: 999px;

    z-index: 1;                /* ← di bawah ornamen */
  }

  /* Ujung kanan (SVG_IGN-R) — full tinggi, di ATAS */
  .plat-nama .ujung-kanan {
    width: 24px;
    height: 100%;
    background: url('Assets/SVG_IGN-R.svg') no-repeat center center;
    background-size: 100% 100%;
    flex-shrink: 0;
    position: relative;
    z-index: 3;                 /* ← paling atas */
  }

  /* Teks nama */
  .plat-nama .teks-nama {
    color: #f5e6c8;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }

  /* ===== LAYAR PERINGATAN PORTRAIT ===== */
  .rotate-warning {
    display: none;
    position: fixed;
    inset: 0;
    background: #1a1a1a;
    color: #f0d78c;
    z-index: 9999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .rotate-warning .ikon-putar {
    font-size: 64px;
    margin-bottom: 20px;
    animation: putar 1.6s ease-in-out infinite;
  }

  .rotate-warning h2 {
    font-size: 20px;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .rotate-warning p {
    font-size: 14px;
    color: #c9a55a;
  }

  @keyframes putar {
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(90deg); }
    100% { transform: rotate(0deg); }
  }

  @media (orientation: portrait) {
    .rotate-warning { display: flex; }
    .stage, .bg { display: none; }
  }

</style>
</head>
<body>

  <div class="bg"></div>

  <div class="stage">

    <!-- ===== TOMBOL KIRI ATAS ===== -->
    <div class="btn-wrap kiri-atas">
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>
      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BT-MENU.svg" width="200" height="80"/>
      </svg>
      <div class="ikon"></div>
    </div>

    <!-- ===== PLAT NAMA ===== -->
    <div class="plat-nama">
      <div class="ujung-kiri"></div>
      <div class="tengah">
        <span class="teks-nama">PLAYER</span>
      </div>
      <div class="ujung-kanan"></div>
    </div>

    <!-- ===== TOMBOL KANAN ATAS ===== -->
    <div class="btn-wrap kanan-atas">
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>
      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BT-MENU.svg" width="200" height="80"/>
      </svg>
      <div class="ikon"></div>
    </div>

  </div>

  <!-- ===== PERINGATAN PORTRAIT ===== -->
  <div class="rotate-warning">
    <div class="ikon-putar">📱</div>
    <h2>PUTAR PERANGKAT</h2>
    <p>Halaman ini hanya bisa dibuka dalam mode landscape</p>
  </div>

</body>
</html>
