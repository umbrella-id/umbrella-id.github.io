<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guild Toram</title>
<style>

  /* ===== RESET DASAR ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: sans-serif;
    background: #000;
  }

  /* ===== BACKGROUND GAME ===== */
  .bg {
    position: fixed;
    inset: 0;
    background: url('Assets/Background.png') no-repeat center center;
    background-size: cover;
    z-index: 1;
  }

  /* ===== STAGE ===== */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    z-index: 2;
  }

  /* ===== KOTAK TOMBOL (ornamen + tombol) ===== */
  /* Setiap tombol punya wrapper, isi: ornamen + tombol di atasnya */
  .btn-wrap {
    position: absolute;
    width: 200px;
    height: 70px;
  }

  /* Pojok kiri atas */
  .btn-wrap.kiri-atas {
    top: 10px;
    left: 10px;
  }

  /* Pojok kanan atas */
  .btn-wrap.kanan-atas {
    top: 10px;
    right: 10px;
  }

  /* ===== ORNAMEN (SVG_BG-MENU.svg) ===== */
  .btn-ornamen {
    position: absolute;
    inset: 0;
    background: url('Assets/SVG_BG-MENU.svg') no-repeat center center;
    background-size: 100% 100%;
    pointer-events: none;   /* biar klik tembus ke tombol */
  }

  /* ===== TOMBOL (SVG_BT-MENU.svg) ===== */
  .btn-isi {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70%;
    height: 55%;
    background: url('Assets/SVG_BT-MENU.svg') no-repeat center center;
    background-size: 100% 100%;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: transform 0.1s ease, filter 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  /* Efek hover (desktop) */
  .btn-isi:hover {
    filter: brightness(1.2) drop-shadow(0 0 10px rgba(107, 189, 232, 0.7));
  }

  /* Efek tekan (klik / tap) */
  .btn-isi:active {
    transform: translate(-50%, -50%) scale(0.92);
    filter: brightness(0.75);
    /* efek masuk ke dalam */
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
  }

</style>
</head>
<body>

  <!-- Background game -->
  <div class="bg"></div>

  <!-- Stage -->
  <div class="stage">

    <!-- Tombol KIRI ATAS -->
    <div class="btn-wrap kiri-atas">
      <div class="btn-ornamen"></div>
      <button class="btn-isi" aria-label="Menu Kiri"></button>
    </div>

    <!-- Tombol KANAN ATAS -->
    <div class="btn-wrap kanan-atas">
      <div class="btn-ornamen"></div>
      <button class="btn-isi" aria-label="Menu Kanan"></button>
    </div>

  </div>

</body>
</html>
