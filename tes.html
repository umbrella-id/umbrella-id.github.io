<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guild Toram</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== BACKGROUND GAME ===== */
  .bg {
    position: fixed;
    inset: 0;
    background: url('Assets/Background.png') no-repeat center center;
    background-size: cover;
    z-index: 1;
  }

  /* ===== STAGE ===== */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    z-index: 2;
  }

  /* ===== WRAPPER TOMBOL ===== */
  .btn-wrap {
    position: absolute;
    top: 0;
    width: 180px;
    height: 72px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-wrap.kiri-atas { top: 0; left: 0; }
  .btn-wrap.kanan-atas { top: 0; right: 0; }

  /* ===== SVG DASAR ===== */
  .btn-wrap svg {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Ornamen — full area wrapper */
  .btn-wrap .svg-ornamen {
    top: 0;
    left: 0;
  }

  /* Tombol — center di dalam ornamen */
  .btn-wrap .svg-tombol {
    top: 50%;
    left: 50%;
    width: 70%;
    height: 70%;
    transform: translate(-50%, -50%);
    transform-origin: center;
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  /* Hover (desktop) */
  .btn-wrap:hover .svg-tombol {
    filter: brightness(1.25) drop-shadow(0 0 10px rgba(107, 189, 232, 0.8));
  }

  /* Tekan (klik / tap) */
  .btn-wrap:active .svg-tombol {
    transform: translate(-50%, -50%) scale(0.9);
    filter: brightness(0.75) drop-shadow(0 0 4px rgba(107, 189, 232, 0.4));
  }

  /* ===== SLOT IKON ===== */
  .btn-wrap .ikon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 3;
    transition: transform 0.1s ease;
  }

  .btn-wrap .ikon img,
  .btn-wrap .ikon svg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
  }

  .btn-wrap:active .ikon {
    transform: translate(-50%, -50%) scale(0.9);
  }

  /* ===== LAYAR PERINGATAN PORTRAIT ===== */
  .rotate-warning {
    display: none;
    position: fixed;
    inset: 0;
    background: #1a1a1a;
    color: #f0d78c;
    z-index: 9999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .rotate-warning .ikon-putar {
    font-size: 64px;
    margin-bottom: 20px;
    animation: putar 1.6s ease-in-out infinite;
  }

  .rotate-warning h2 {
    font-size: 20px;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .rotate-warning p {
    font-size: 14px;
    color: #c9a55a;
  }

  @keyframes putar {
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(90deg); }
    100% { transform: rotate(0deg); }
  }

  /* Tampilkan peringatan hanya saat portrait */
  @media (orientation: portrait) {
    .rotate-warning {
      display: flex;
    }
    .stage, .bg {
      display: none;
    }
  }

</style>
</head>
<body>

  <!-- Background game -->
  <div class="bg"></div>

  <!-- Stage -->
  <div class="stage">

    <!-- ===== TOMBOL KIRI ATAS ===== -->
    <div class="btn-wrap kiri-atas">
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>

      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BT-MENU.svg" width="200" height="80"/>
      </svg>

      <div class="ikon">
        <!-- Nanti diisi ikon: -->
        <!-- <img src="Assets/icon-home.svg" alt="Home"> -->
      </div>
    </div>

    <!-- ===== TOMBOL KANAN ATAS ===== -->
    <div class="btn-wrap kanan-atas">
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>

      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BT-MENU.svg" width="200" height="80"/>
      </svg>

      <div class="ikon">
        <!-- Nanti diisi ikon -->
      </div>
    </div>

  </div>

  <!-- ===== PERINGATAN PORTRAIT ===== -->
  <div class="rotate-warning">
    <div class="ikon-putar">📱</div>
    <h2>PUTAR PERANGKAT</h2>
    <p>Halaman ini hanya bisa dibuka dalam mode landscape</p>
  </div>

</body>
</html>
