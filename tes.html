<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guild Toram</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Optima', 'Optima LT', 'Segoe UI', Candara, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== BACKGROUND ===== */
  .bg {
    position: fixed;
    inset: 0;
    background: url('Assets/Background.png') no-repeat center center;
    background-size: cover;
    z-index: 1;
  }

  /* ===== STAGE ===== */
  .stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 300px;
    transform-origin: center center;
    z-index: 2;
  }

  /* ===== TOMBOL ===== */
  .btn-wrap {
    position: absolute;
    top: 0;
    width: 180px;
    height: 72px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.3s ease;
  }

  .btn-wrap.kiri-atas { top: 0; left: 0; }
  .btn-wrap.kanan-atas { top: 0; right: 0; }

  .btn-wrap svg {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .btn-wrap .svg-ornamen { top: 0; left: 0; }

  .btn-wrap .svg-tombol {
    top: 50%;
    left: 50%;
    width: 70%;
    height: 70%;
    transform: translate(-50%, -50%);
    transform-origin: center;
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  .btn-wrap:hover .svg-tombol {
    filter: brightness(1.25) drop-shadow(0 0 10px rgba(107, 189, 232, 0.8));
  }

  .btn-wrap:active .svg-tombol {
    transform: translate(-50%, -50%) scale(0.9);
    filter: brightness(0.75) drop-shadow(0 0 4px rgba(107, 189, 232, 0.4));
  }

  .btn-wrap .ikon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 3;
    transition: transform 0.1s ease;
  }

  .btn-wrap .ikon img,
  .btn-wrap .ikon svg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
  }

  /* ===== PLAT NAMA ===== */
  .plat-nama {
    position: absolute;
    top: 5px;
    left: 155px;
    height: 38px;
    display: flex;
    align-items: stretch;
    z-index: 3;
    pointer-events: none;
    white-space: nowrap;
  }

  .plat-nama .ujung-kiri {
    width: 28px;
    height: 100%;
    background: url('Assets/SVG_IGN-L.svg') no-repeat center center;
    background-size: 100% 100%;
    flex-shrink: 0;
    flex-grow: 0;
  }

  .plat-nama .tengah {
    height: 100%;
    flex-grow: 1;
    flex-shrink: 1;
    min-width: 60px;
    position: relative;
    background: url('Assets/SVG_IGN-M.svg') no-repeat center center;
    background-size: 100% 100%;
  }

  .plat-nama .ujung-kanan {
    width: 38px;
    height: 100%;
    background: url('Assets/SVG_IGN-R.svg') no-repeat center center;
    background-size: 100% 100%;
    flex-shrink: 0;
    flex-grow: 0;
  }

  .plat-nama .teks-nama {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #f5e6c8;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.5px;
    white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    z-index: 2;
  }

  /* ===== CHAT BOX ===== */
  .chat-box {
    position: absolute;
    bottom: 0;
    left: 25%;
    width: 50%;
    height: 25%;
    max-height: 100%;
    background: rgba(10, 8, 5, 0.75);
    z-index: 100;
    display: flex;
    flex-direction: column;
    pointer-events: auto;
    /* Animasi snap halus */
    transition: height 0.25s ease-out;
  }

  /* Saat sedang di-drag — matikan transisi biar responsif */
  .chat-box.dragging {
    transition: none;
  }

  /* ===== AREA DRAG ===== */
  .chat-drag {
    position: absolute;
    top: -10px;
    left: 0;
    width: 100%;
    height: 20px;
    cursor: ns-resize;
    z-index: 1;
  }

  /* ===== ISI CHAT ===== */
  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    color: #e0d5b8;
    font-size: 13px;
    line-height: 1.5;
  }

  .chat-line {
    padding: 2px 0;
    word-wrap: break-word;
  }

  .chat-name {
    color: #f0d78c;
    font-weight: 600;
    margin-right: 6px;
  }

  .chat-text { color: #e0d5b8; }

  .chat-body::-webkit-scrollbar { width: 4px; }
  .chat-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  .chat-body::-webkit-scrollbar-thumb {
    background: rgba(201, 165, 90, 0.4);
    border-radius: 2px;
  }

  /* ===== RESPONSIF ===== */
  @media (max-aspect-ratio: 22/10) {
    .btn-wrap.kiri-atas { transform: translateX(-30%); }
    .btn-wrap.kanan-atas { transform: translateX(30%); }
  }

  /* ===== PORTRAIT ===== */
  .rotate-warning {
    display: none;
    position: fixed;
    inset: 0;
    background: #1a1a1a;
    color: #f0d78c;
    z-index: 99999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .rotate-warning .ikon-putar {
    font-size: 64px;
    margin-bottom: 20px;
    animation: putar 1.6s ease-in-out infinite;
  }

  .rotate-warning h2 { font-size: 20px; margin-bottom: 8px; letter-spacing: 1px; }
  .rotate-warning p { font-size: 14px; color: #c9a55a; }

  @keyframes putar {
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(90deg); }
    100% { transform: rotate(0deg); }
  }

  @media (orientation: portrait) {
    .rotate-warning { display: flex; }
    .stage, .bg { display: none; }
  }

</style>
</head>
<body>

  <div class="bg"></div>

  <div class="stage" id="stage">

    <div class="btn-wrap kiri-atas">
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>
      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BT-MENU.svg" width="200" height="80"/>
      </svg>
      <div class="ikon"></div>

      <div class="plat-nama">
        <div class="ujung-kiri"></div>
        <div class="tengah">
          <span class="teks-nama">PLAYER</span>
        </div>
        <div class="ujung-kanan"></div>
      </div>
    </div>

    <div class="btn-wrap kanan-atas">
      <svg class="svg-ornamen" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BG-MENU.svg" width="200" height="80"/>
      </svg>
      <svg class="svg-tombol" viewBox="0 0 200 80" preserveAspectRatio="none">
        <image href="Assets/SVG_BT-MENU.svg" width="200" height="80"/>
      </svg>
      <div class="ikon"></div>
    </div>

  </div>

  <!-- ===== CHAT BOX ===== -->
  <div class="chat-box" id="chatBox">
    <div class="chat-drag" id="chatDrag"></div>

    <div class="chat-body" id="chatBody">
      <div class="chat-line">
        <span class="chat-name">[Guild]:</span>
        <span class="chat-text">Selamat datang di guild UMBRELLA!</span>
      </div>
      <div class="chat-line">
        <span class="chat-name">Player1:</span>
        <span class="chat-text">Halo semua</span>
      </div>
      <div class="chat-line">
        <span class="chat-name">Player2:</span>
        <span class="chat-text">Ayo raid malam ini</span>
      </div>
      <div class="chat-line">
        <span class="chat-name">Player3:</span>
        <span class="chat-text">Siap!</span>
      </div>
      <div class="chat-line">
        <span class="chat-name">Player4:</span>
        <span class="chat-text">Saya ikut</span>
      </div>
      <div class="chat-line">
        <span class="chat-name">Player5:</span>
        <span class="chat-text">Jam berapa mulai?</span>
      </div>
      <div class="chat-line">
        <span class="chat-name">Player1:</span>
        <span class="chat-text">Jam 8 malam ya</span>
      </div>
      <div class="chat-line">
        <span class="chat-name">Player2:</span>
        <span class="chat-text">OK</span>
      </div>
      <div class="chat-line">
        <span class="chat-name">Player3:</span>
        <span class="chat-text">Siap hadir</span>
      </div>
    </div>
  </div>

  <!-- ===== PERINGATAN PORTRAIT ===== -->
  <div class="rotate-warning">
    <div class="ikon-putar">📱</div>
    <h2>PUTAR PERANGKAT</h2>
    <p>Halaman ini hanya bisa dibuka dalam mode landscape</p>
  </div>

  <script>
    // ===== AUTO SCALE STAGE =====
    const BASE_HEIGHT = 300;

    function resizeStage() {
      const stage = document.getElementById('stage');
      if (!stage) return;

      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scale = vh / BASE_HEIGHT;
      const stageWidth = vw / scale;

      stage.style.width = stageWidth + 'px';
      stage.style.height = BASE_HEIGHT + 'px';
      stage.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }

    window.addEventListener('load', resizeStage);
    window.addEventListener('resize', resizeStage);
    window.addEventListener('orientationchange', resizeStage);

    // ===== CHAT DRAG + SNAP =====
    const chatBox = document.getElementById('chatBox');
    const chatDrag = document.getElementById('chatDrag');

    let isDragging = false;
    let startY = 0;
    let startHeight = 0;

    const DEFAULT_PERCENT = 25;         // posisi awal
    const SNAP_THRESHOLD = 75;          // ambang snap
    const FULL_PERCENT = 100;           // posisi fullscreen
    const MIN_PERCENT = 3;              // minimal saat ditarik ke bawah

    function onDown(e) {
      isDragging = true;
      startY = getY(e);
      startHeight = chatBox.getBoundingClientRect().height;
      chatBox.classList.add('dragging');
      e.preventDefault();
    }

    function onMove(e) {
      if (!isDragging) return;

      const currentY = getY(e);
      const deltaY = startY - currentY;   // positif = naik
      const vh = window.innerHeight;
      const newHeight = startHeight + deltaY;
      const percent = (newHeight / vh) * 100;
      const clamped = Math.max(MIN_PERCENT, Math.min(FULL_PERCENT, percent));

      chatBox.style.height = clamped + '%';
      e.preventDefault();
    }

    function onUp() {
      if (!isDragging) return;
      isDragging = false;
      chatBox.classList.remove('dragging');

      // ===== SNAP LOGIC =====
      const vh = window.innerHeight;
      const currentHeight = chatBox.getBoundingClientRect().height;
      const currentPercent = (currentHeight / vh) * 100;

      if (currentPercent > SNAP_THRESHOLD) {
        // Lewat 75% → snap ke 100%
        chatBox.style.height = FULL_PERCENT + '%';
      } else {
        // ≤ 75% → snap balik ke 25%
        chatBox.style.height = DEFAULT_PERCENT + '%';
      }
    }

    function getY(e) {
      return e.clientY || (e.touches && e.touches[0].clientY) || 0;
    }

    chatDrag.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);

    chatDrag.addEventListener('touchstart', onDown, { passive: false });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  </script>

</body>
</html>
